<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄機探秘：專屬命理與流年運勢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Serif TC', serif; 
            background-color: #FDFBF7; 
            color: #334155; 
            min-height: 100vh; 
            background-image: radial-gradient(#E2E8F0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .mystic-card { 
            background: #FFFFFF; 
            border: 1px solid #E2E8F0; 
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08); 
            border-radius: 1.5rem; /* 更圓潤的邊角 */
            position: relative;
            overflow: hidden;
        }
        .mystic-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px; /* 加粗頂部飾條 */
            background: linear-gradient(90deg, #b45309, #d97706, #f59e0b); /* 更沉穩的琥珀漸層 */
        }
        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #D97706;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* 八字排盤特殊樣式 */
        .bazi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="%23fcd34d" stroke-width="0.5" opacity="0.3"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)" /></svg>');
            background-color: #fffbeb;
            border: 1px solid #fde68a;
        }
        .bazi-pillar {
            font-family: 'Noto Serif TC', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem; /* 確保上下字有適當間距，絕不會被 PDF 引擎誤判 */
        }
        .bazi-element {
            display: block;
            line-height: 1.1;
        }
        /* 報告區塊樣式 */
        .report-section-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #92400e;
            font-weight: 900;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #fef3c7;
        }
        .report-content {
            line-height: 1.8;
            color: #475569;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <header class="text-center mb-12 mt-8 w-full max-w-5xl">
        <h1 class="text-4xl md:text-5xl font-black text-amber-900 mb-3 tracking-widest drop-shadow-sm flex justify-center items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
            玄機探秘
        </h1>
        <p class="text-amber-700 tracking-wider font-bold">精準排盤 ‧ 白話解析 ‧ 掌握先機</p>
    </header>

    <main class="w-full max-w-4xl flex flex-col items-center">
        
        <!-- 輸入表單區塊 -->
        <section id="userInfoSection" class="mystic-card p-8 md:p-10 w-full max-w-md mb-8 transition-all duration-500">
            <h2 class="text-xl text-center text-amber-800 mb-8 font-bold flex items-center justify-center gap-2">
                輸入命理資訊
            </h2>
            
            <div id="errorMsg" class="hidden mb-4 p-3 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm text-center"></div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">真實姓名</label>
                    <input type="text" id="userName" placeholder="請輸入姓名" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-colors">
                </div>
                
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-sm font-bold text-gray-700 mb-2">性別</label>
                        <select id="userGender" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-colors">
                            <option value="male">男 (乾造)</option>
                            <option value="female">女 (坤造)</option>
                        </select>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-bold text-gray-700 mb-2">出生日期</label>
                        <input type="text" id="birthDate" placeholder="YYYYMMDD" maxlength="8" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">出生時辰</label>
                    <select id="birthTime" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-colors">
                        <option value="-1">不知道時辰 (以正午排盤)</option>
                        <option value="0">子時 (23:00 - 00:59)</option>
                        <option value="1">丑時 (01:00 - 02:59)</option>
                        <option value="2">寅時 (03:00 - 04:59)</option>
                        <option value="3">卯時 (05:00 - 06:59)</option>
                        <option value="4">辰時 (07:00 - 08:59)</option>
                        <option value="5">巳時 (09:00 - 10:59)</option>
                        <option value="6">午時 (11:00 - 12:59)</option>
                        <option value="7">未時 (13:00 - 14:59)</option>
                        <option value="8">申時 (15:00 - 16:59)</option>
                        <option value="9">酉時 (17:00 - 18:59)</option>
                        <option value="10">戌時 (19:00 - 20:59)</option>
                        <option value="11">亥時 (21:00 - 22:59)</option>
                    </select>
                </div>

                <div class="pt-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">心中所問之事 <span class="text-xs text-amber-600 font-normal">(選填)</span></label>
                    <textarea id="userQuestion" placeholder="例如：今年適合換工作嗎？或是想問特定的感情狀況..." class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-colors resize-none" rows="2"></textarea>
                    <p class="text-xs text-gray-500 mt-1">若填寫，大師將於報告最後為您針對此疑惑進行專屬解答。</p>
                </div>

                <button id="submitBtn" onclick="startDivination()" class="w-full mt-8 bg-amber-700 hover:bg-amber-800 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2">
                    <span id="btnText">開始推演命盤</span>
                    <div id="btnLoader" class="loader hidden"></div>
                </button>
            </div>
        </section>

        <!-- 命理報告區塊 (預設隱藏) -->
        <section id="reportSection" class="w-full max-w-4xl hidden">
            <!-- 將需要匯出 PDF 的內容包裝在此 div 中 -->
            <div id="pdfContent" class="mystic-card p-6 md:p-12 mb-8 bg-white">
                
                <!-- 報告頭部資訊 -->
                <div class="text-center mb-10 pb-8 border-b border-amber-100">
                    <h2 class="text-3xl md:text-4xl font-black text-amber-900 mb-4">專屬命理與流年分析報告</h2>
                    <div class="inline-flex items-center gap-3 bg-amber-50 px-6 py-2 rounded-full border border-amber-200">
                        <span class="text-gray-500 text-sm">命主</span>
                        <span id="resName" class="font-bold text-xl text-amber-900"></span>
                        <span id="resGender" class="text-xs font-bold px-2 py-1 bg-amber-100 text-amber-800 rounded-md"></span>
                    </div>
                    <div class="mt-4 flex flex-col md:flex-row justify-center gap-4 text-sm text-gray-600">
                        <div class="flex items-center justify-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> 西曆：<span id="resSolarDate"></span></div>
                        <div class="hidden md:block text-gray-300">|</div>
                        <div class="flex items-center justify-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg> 農曆：<span id="resLunarDate"></span></div>
                    </div>
                </div>

                <!-- 八字排盤顯示區 -->
                <div class="mb-12">
                    <h3 class="report-section-title text-xl">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>
                        命盤結構 (四柱八字)
                    </h3>
                    <p class="text-sm text-gray-500 mb-4">此為您先天的能量結構，日柱代表您本身。</p>
                    
                    <div class="bazi-grid p-6 rounded-2xl break-inside-avoid">
                        <!-- 年柱 -->
                        <div class="flex flex-col items-center">
                            <span class="text-xs font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full mb-3">年柱 (祖輩)</span>
                            <div class="bazi-pillar text-4xl md:text-5xl font-black text-gray-800" id="pillarYear"><span class="bazi-element">甲</span><span class="bazi-element">子</span></div>
                        </div>
                        <!-- 月柱 -->
                        <div class="flex flex-col items-center">
                            <span class="text-xs font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full mb-3">月柱 (父母)</span>
                            <div class="bazi-pillar text-4xl md:text-5xl font-black text-gray-800" id="pillarMonth"><span class="bazi-element">乙</span><span class="bazi-element">丑</span></div>
                        </div>
                        <!-- 日柱 (元男/元女) -->
                        <div class="flex flex-col items-center relative">
                            <div class="absolute -top-3 px-2 py-0.5 bg-red-100 text-red-600 text-[10px] font-bold rounded shadow-sm z-10 border border-red-200">代表您</div>
                            <span class="text-xs font-bold text-white bg-amber-800 px-3 py-1 rounded-full mb-3 shadow-md">日柱 (本命)</span>
                            <div class="bazi-pillar text-4xl md:text-5xl font-black text-red-800 drop-shadow-sm" id="pillarDay"><span class="bazi-element">丙</span><span class="bazi-element">寅</span></div>
                        </div>
                        <!-- 時柱 -->
                        <div class="flex flex-col items-center">
                            <span class="text-xs font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full mb-3">時柱 (子女)</span>
                            <div class="bazi-pillar text-4xl md:text-5xl font-black text-gray-800" id="pillarTime"><span class="bazi-element">丁</span><span class="bazi-element">卯</span></div>
                        </div>
                    </div>
                </div>

                <!-- 運勢解析 (由 AI 產生) -->
                <div>
                    <h3 class="report-section-title text-xl mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        大師白話批斷與流年預測
                    </h3>
                    
                    <div id="aiFortuneText" class="report-content">
                        <!-- 載入動畫會在這裡顯示 -->
                    </div>
                </div>
                
                <div class="mt-12 text-center text-xs text-gray-400 border-t border-gray-100 pt-6">
                    <p>報告生成時間：<span id="reportTime"></span></p>
                    <p class="mt-1">※ 本報告由 AI 輔助結合傳統命理生成，旨在提供正向指引。命運掌握在自己手中，請理性參考。</p>
                </div>
            </div>

            <!-- 操作按鈕區 -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center px-4">
                <button onclick="resetApp()" class="w-full sm:w-auto px-8 py-3.5 bg-white border border-gray-300 text-gray-700 font-bold rounded-xl hover:bg-gray-50 transition-colors shadow-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    重新排盤
                </button>
                <button onclick="exportPDF()" class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-amber-600 to-amber-800 hover:from-amber-700 hover:to-amber-900 text-white font-bold rounded-xl transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2 focus:ring-2 focus:ring-offset-2 focus:ring-amber-700 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    下載完整 PDF 報告
                </button>
            </div>
        </section>
    </main>

    <script>
        const apiKey = ""; // The execution environment provides the key at runtime

        // 時辰對應實際小時 (取該時辰中間值以便於計算)
        const timeMap = {
            "0": 0,   // 子 23-1
            "1": 2,   // 丑 1-3
            "2": 4,   // 寅 3-5
            "3": 6,   // 卯 5-7
            "4": 8,   // 辰 7-9
            "5": 10,  // 巳 9-11
            "6": 12,  // 午 11-13
            "7": 14,  // 未 13-15
            "8": 16,  // 申 15-17
            "9": 18,  // 酉 17-19
            "10": 20, // 戌 19-21
            "11": 22  // 亥 21-23
        };

        async function startDivination() {
            const name = document.getElementById('userName').value.trim();
            const dateStr = document.getElementById('birthDate').value.trim();
            const timeVal = document.getElementById('birthTime').value;
            const gender = document.getElementById('userGender').value;
            const question = document.getElementById('userQuestion').value.trim();

            if (!name) return showError("請輸入您的真實姓名以建立連結。");
            if (!/^\d{8}$/.test(dateStr)) return showError("出生日期格式錯誤，請輸入8位數字 (如 19900520)。");
            
            const year = parseInt(dateStr.substring(0, 4));
            const month = parseInt(dateStr.substring(4, 6));
            const day = parseInt(dateStr.substring(6, 8));

            if (month < 1 || month > 12 || day < 1 || day > 31 || year < 1900 || year > 2100) {
                return showError("輸入的日期不合法，請重新確認。");
            }

            toggleLoading(true);

            try {
                let hour = timeVal === "-1" ? 12 : timeMap[timeVal]; 
                const solar = Solar.fromYmdHms(year, month, day, hour, 0, 0);
                const lunar = solar.getLunar();
                const baZi = lunar.getEightChar();

                const baziData = {
                    year: baZi.getYear(),
                    month: baZi.getMonth(),
                    day: baZi.getDay(),
                    time: timeVal === "-1" ? "未知" : baZi.getTime()
                };

                document.getElementById('resName').textContent = name;
                document.getElementById('resGender').textContent = gender === 'male' ? '乾造 (男)' : '坤造 (女)';
                document.getElementById('resSolarDate').textContent = `${year}年 ${month}月 ${day}日`;
                document.getElementById('resLunarDate').textContent = `${lunar.getYearInGanZhi()}年 ${lunar.getMonthInChinese()}月 ${lunar.getDayInChinese()}`;
                
                const now = new Date();
                document.getElementById('reportTime').textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                const formatPillar = (ganzhi) => {
                    if (ganzhi && ganzhi.length === 2) {
                        return `<span class="bazi-element">${ganzhi[0]}</span><span class="bazi-element">${ganzhi[1]}</span>`;
                    }
                    return ganzhi || "未知";
                };
                
                document.getElementById('pillarYear').innerHTML = formatPillar(baziData.year);
                document.getElementById('pillarMonth').innerHTML = formatPillar(baziData.month);
                document.getElementById('pillarDay').innerHTML = formatPillar(baziData.day);
                document.getElementById('pillarTime').innerHTML = formatPillar(baziData.time);

                document.getElementById('userInfoSection').classList.add('hidden');
                document.getElementById('reportSection').classList.remove('hidden');
                document.getElementById('reportSection').scrollIntoView({ behavior: 'smooth' });

                await fetchAIFortune(name, gender, baziData, question);

            } catch (error) {
                console.error(error);
                showError("排盤時發生錯誤，請確認輸入資料是否正確。");
                toggleLoading(false);
            }
        }

        function parseMarkdown(text) {
            if (!text) return "未能取得天機，請稍後再試。";
            
            // 處理大標題 (### 標題) - 轉化為具有設計感的區塊標題
            let html = text.replace(/^### (.*$)/gim, `
                <div class="mt-8 mb-4">
                    <h4 class="inline-block text-lg font-bold text-amber-800 bg-amber-50 px-4 py-2 rounded-lg border border-amber-100">$1</h4>
                </div>
            `);
            
            html = html.replace(/^## (.*$)/gim, '<h3 class="text-2xl font-black text-amber-900 mt-10 mb-4 border-b-2 border-amber-200 pb-2">$1</h3>');
            
            // 處理粗體 (重點標示)
            html = html.replace(/\*\*(.*?)\*\*/g, '<span class="font-bold text-amber-900 bg-amber-50 px-1 rounded">$1</span>');
            
            // 處理列表 (美化列表項目)
            html = html.replace(/^\* (.*$)/gim, '<li class="ml-6 mb-2 list-disc text-gray-700 marker:text-amber-500">$1</li>');
            html = html.replace(/^- (.*$)/gim, '<li class="ml-6 mb-2 list-disc text-gray-700 marker:text-amber-500">$1</li>');
            
            // 將連續的 li 包裝在 ul 中 (簡單處理)
            html = html.replace(/(<li.*<\/li>)\n(<li.*<\/li>)/g, '$1$2'); 
            
            // 處理換行，給予段落適當的間距
            html = html.split('\n').map(line => {
                if (line.trim() === '' || line.startsWith('<div') || line.startsWith('<h') || line.startsWith('<li')) return line;
                return `<p class="mb-4 text-justify text-gray-700">$1</p>`.replace('$1', line);
            }).join('');

            return html;
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            setTimeout(() => { errorDiv.classList.add('hidden'); }, 4000);
        }

        function toggleLoading(isLoading) {
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const submitBtn = document.getElementById('submitBtn');
            const inputs = document.querySelectorAll('input, select, textarea');

            if (isLoading) {
                btnText.textContent = "正在連結命運星盤...";
                btnLoader.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
                inputs.forEach(input => input.disabled = true);
            } else {
                btnText.textContent = "開始推演命盤";
                btnLoader.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                inputs.forEach(input => input.disabled = false);
            }
        }

        async function fetchAIFortune(name, gender, bazi, question) {
            const fortuneTextContainer = document.getElementById('aiFortuneText');
            
            // 精緻的載入狀態
            fortuneTextContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 bg-gray-50 rounded-xl border border-gray-100">
                    <div class="loader w-10 h-10 mb-4 border-4"></div>
                    <p class="text-amber-800 font-bold text-lg mb-2">正在請示天地能量，推演十二流月與精細命盤...</p>
                    <p class="text-sm text-gray-500">正在分析五行生剋與流年星曜，這可能需要幾秒鐘</p>
                </div>
            `;

            const genderText = gender === 'male' ? '男命（乾造）' : '女命（坤造）';
            
            // 若使用者有填寫問題，動態新增提問指令
            let questionInstruction = "";
            let questionFormat = "";
            if (question) {
                questionInstruction = `\n求問者特別詢問了一件事情：「${question}」。請務必在看盤時將此問題納入考量。`;
                questionFormat = `\n\n### 專屬問事解答\n（針對求問者的問題：「${question}」，請以八字流年理論為基礎，給予最直接、具體且實用的吉凶判斷與行動建議。）`;
            }
            
            const prompt = `
            你現在是一位執業超過三十年、精通傳統子平八字與盲派命理的宗師。你極度擅長精算「十神格局」、「五行生剋制化」、「流年大運刑衝破害」以及「神煞（如驛馬、桃花、羊刃、天乙貴人）」。
            同時，你具備高度的同理心，能將這些深奧準確的命理學理，轉化為現代人能輕鬆理解、且具備高度建設性的**白話文**指引。

            求問者姓名：「${name}」，性別：「${genderText}」。
            其四柱八字排盤為：年柱【${bazi.year}】、月柱【${bazi.month}】、日柱【${bazi.day}】、時柱【${bazi.time}】。${questionInstruction}

            現在是 2026 年。請你在腦海中先精確運算其日主強弱、喜用神、忌神，以及 2026 丙午年天干地支對其命盤全局的生剋影響。
            接著，請務必遵守以下原則撰寫報告：
            1. **專業底蘊，白話輸出**：不要直接丟出艱澀術語（如「傷官見官」），請翻譯成實際狀況（如「今年職場上易與主管產生摩擦」），但論斷必須基於嚴謹的八字理論。
            2. **精準斷事，具體解方**：給出具體的吉凶、幸運方位/顏色，以及趨吉避凶的實際行動。
            3. 嚴格按照以下標題結構（使用 Markdown 的 ###）輸出，文字需排版美觀：

            ### 本命格局深度解析
            （一針見血地點出其命格最大特色、性格優勢與一生需注意的盲點。指出其隱藏的潛力。）

            ### 2026年 (丙午年) 流年總體檢
            （綜合論述丙午年的火土之氣對求問者的影響，務必分為以下三點：）
            * **事業與財富發展：** (精準指出正偏財運、職場升遷或轉職時機、理財建議)
            * **感情與人際關係：** (桃花方位、婚姻狀態、防範小人)
            * **健康與身心調適：** (需注意的身體機能或壓力來源)

            ### 2026年 十二流月精批 (逐月導航)
            （務必逐月列出 1月至 12月的流月運勢，結合流月干支與本命的生剋，每個月用 2-3 句話精準提示：）
            * **一月：** * **二月：** * **三月：** * **四月：** * **五月：** * **六月：** * **七月：** * **八月：** * **九月：** * **十月：** * **十一月：** * **十二月：** ### 未來三年運勢導航 (2027-2029)
            （點出未來三年的大方向與年度關鍵字：）
            * **2027年 (丁未年)：** * **2028年 (戊申年)：** * **2029年 (己酉年)：** ${questionFormat}`;

            const requestBody = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            // 實作 Exponential Backoff 重試機制
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];
            let attempt = 0;
            let success = false;
            let responseData = null;

            while (attempt < maxRetries && !success) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) throw new Error('API Request Failed');
                    
                    responseData = await response.json();
                    success = true;
                } catch (err) {
                    attempt++;
                    if (attempt < maxRetries) {
                        await new Promise(resolve => setTimeout(resolve, delays[attempt - 1]));
                    } else {
                        fortuneTextContainer.innerHTML = `
                            <div class="p-6 bg-red-50 border border-red-200 rounded-xl text-center">
                                <p class="text-red-600 font-bold mb-2">天機受阻，無法獲取流年運勢</p>
                                <p class="text-sm text-red-500">這可能是因為系統繁忙，請稍後再重新排盤嘗試。</p>
                            </div>
                        `;
                        toggleLoading(false);
                        return;
                    }
                }
            }

            if (success && responseData && responseData.candidates && responseData.candidates.length > 0) {
                let aiText = responseData.candidates[0].content.parts[0].text;
                fortuneTextContainer.innerHTML = parseMarkdown(aiText);
            } else {
                fortuneTextContainer.innerHTML = `
                    <div class="p-6 bg-red-50 border border-red-200 rounded-xl text-center">
                        <p class="text-red-600 font-bold mb-2">解析天機時發生異常</p>
                        <p class="text-sm text-red-500">未收到有效回覆，請稍後再試。</p>
                    </div>
                `;
            }
            
            toggleLoading(false);
        }

        function resetApp() {
            document.getElementById('reportSection').classList.add('hidden');
            document.getElementById('userInfoSection').classList.remove('hidden');
            document.getElementById('aiFortuneText').innerHTML = "正在推演天機...";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function exportPDF() {
            const element = document.getElementById('pdfContent');
            const name = document.getElementById('resName').textContent;
            
            // PDF 設定優化，確保字體清晰與邊距適當
            const opt = {
                margin:       [15, 15, 15, 15], // top, left, bottom, right (稍微加大邊距)
                filename:     `玄機探秘_${name}的命理報告.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true,
                    letterRendering: true,
                    scrollY: 0
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] } // 加入此行：啟用智慧斷頁防截斷
            };

            // 改變按鈕狀態
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<div class="loader w-4 h-4 border-2 border-white border-t-transparent mr-2"></div> 製作卷軸中...`;
            btn.disabled = true;

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>

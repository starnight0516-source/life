        function getTenGod(dayMaster, targetStem) {
            const dmIndex = stemsList.indexOf(dayMaster);
            const tsIndex = stemsList.indexOf(targetStem);
            return tenGodsMatrix[dmIndex][tsIndex];
        }

        // --- 五虎遁 (推算流月天干) ---
        // 甲己之年丙作首，乙庚之歲戊為頭...
        function getMonthGanZhi(yearGan, monthIndex) { 
            // monthIndex: 0 = 寅月(正月), 1 = 卯月(二月) ...
            let startStemIndex;
            if (yearGan === '甲' || yearGan === '己') startStemIndex = 2; // 丙
            else if (yearGan === '乙' || yearGan === '庚') startStemIndex = 4; // 戊
            else if (yearGan === '丙' || yearGan === '辛') startStemIndex = 6; // 庚
            else if (yearGan === '丁' || yearGan === '壬') startStemIndex = 8; // 壬
            else startStemIndex = 0; // 甲 (戊癸)

            const mGan = stemsList[(startStemIndex + monthIndex) % 10];
            const mZhi = branchesList[(2 + monthIndex) % 12]; // 寅是地支第3個(index 2)
            return { gan: mGan, zhi: mZhi, ganzhi: mGan + mZhi };
        }

        // --- 核心推演邏輯 (徹底移除 Random) ---
        function calculateFortune() {
            const name = document.getElementById('userName').value.trim();
            const bDate = document.getElementById('birthDate').value.trim();
            const hour = parseInt(document.getElementById('birthTime').value);
            const genderVal = document.querySelector('input[name="gender"]:checked').value;
            
            if(!name || bDate.length !== 8 || isNaN(parseInt(bDate))) {
                alert("大師提醒：請輸入真實姓名與正確的8碼國曆日期 (如 19900520) 才能精準推演。");
                return;
            }

            const inputSec = document.getElementById('inputSection');
            const resultSec = document.getElementById('resultSection');
            inputSec.classList.add('opacity-0');
            
            setTimeout(() => {
                inputSec.classList.add('hidden');
                resultSec.classList.remove('hidden');
                
                // 1. 取得精準天文節氣八字
                const y = parseInt(bDate.substring(0, 4));
                const m = parseInt(bDate.substring(4, 6));
                const d = parseInt(bDate.substring(6, 8));
                const currentYear = new Date().getFullYear();
                const currentAge = currentYear - y;
                
                const dateObj = new Date(y, m - 1, d, hour);
                const lunar = Solar.fromDate(dateObj).getLunar();
                const baZi = lunar.getEightChar(); 

                const dayMasterGan = baZi.getDayGan(); 

                document.getElementById('resName').innerText = name;
                document.getElementById('resGender').innerText = `(${genderVal === 'male' ? '乾造' : '坤造'})`;
                document.getElementById('resSolarDate').innerText = `${y}年 ${m}月 ${d}日 ${hour}時`;
                document.getElementById('resLunarDate').innerText = `${lunar.getYearInGanZhi()}年 ${lunar.getMonthInChinese()}月 ${lunar.getDayInChinese()}日 ${lunar.getTimeZhi()}時`;

                // 填寫四柱
                document.getElementById('bzYearGan').innerText = baZi.getYearGan();
                document.getElementById('bzYearZhi').innerText = baZi.getYearZhi();
                document.getElementById('bzMonthGan').innerText = baZi.getMonthGan();
                document.getElementById('bzMonthZhi').innerText = baZi.getMonthZhi();
                document.getElementById('bzDayGan').innerText = dayMasterGan;
                document.getElementById('bzDayZhi').innerText = baZi.getDayZhi();
                document.getElementById('bzTimeGan').innerText = baZi.getTimeGan();
                document.getElementById('bzTimeZhi').innerText = baZi.getTimeZhi();

                // 2. 獲取目前大運 (真正利用 Lunar 的性別順逆排引擎)
                const genderInt = genderVal === 'male' ? 1 : 0;
                const yun = baZi.getYun(genderInt, 1); 
                const daYunArr = yun.getDaYun();
                let currentDaYunGanZhi = "起運前";
                for(let dy of daYunArr) {
                    if(currentAge >= dy.getStartAge() && currentAge <= dy.getEndAge()) {
                        currentDaYunGanZhi = dy.getGanZhi();
                        break;
                    }
                }
                document.getElementById('resDaYun').innerText = currentDaYunGanZhi;

                // 3. 本命元神解析
                const dmData = dayMasterData[dayMasterGan];
                document.getElementById('resDayMaster').innerText = dmData.name;
                document.getElementById('resDayMasterDesc').innerText = dmData.desc;

                // 4. 計算五行與神煞 (基本學理展示)
                const bzChars = [baZi.getYearGan(), baZi.getYearZhi(), baZi.getMonthGan(), baZi.getMonthZhi(), baZi.getDayGan(), baZi.getDayZhi(), baZi.getTimeGan(), baZi.getTimeZhi()];
                let hasTaoHua = false; let hasWenChang = false;
                const taoHuaZhi = {'申':'酉','子':'酉','辰':'酉', '亥':'子','卯':'子','未':'子', '寅':'卯','午':'卯','戌':'卯', '巳':'午','酉':'午','丑':'午'};
                if(bzChars.includes(taoHuaZhi[baZi.getYearZhi()]) || bzChars.includes(taoHuaZhi[baZi.getDayZhi()])) hasTaoHua = true;
                
                let shenShaStr = "命局平和。";
                if(hasTaoHua) shenShaStr = "命帶桃花，異性緣極佳，交際手腕靈活。";
                document.getElementById('resShenShaTitle').innerText = hasTaoHua ? "命帶桃花" : "四柱平和";
                document.getElementById('resShenShaDesc').innerText = shenShaStr + " 八字神煞反映了先天自帶的特殊磁場，會影響您的潛意識與人際關係。";

                document.getElementById('resWuXing').innerText = `以 ${dayMasterGan} 為尊`;
                document.getElementById('resWuXingDesc').innerText = `您的八字以「${dayMasterGan}」為主心骨。流年大運若逢生扶之五行則順遂，若逢剋洩之五行則需沉潛待機。`;

                // 5. 真實十神流年與流月推演
                window.yearlyDataList = [];
                let yearlyHtml = "";

                for(let i=0; i<2; i++) {
                    const targetYear = currentYear + i;
                    const tempSolar = Solar.fromYmd(targetYear, 6, 1);
                    const yGan = tempSolar.getLunar().getYearGan();
                    const yZhi = tempSolar.getLunar().getYearZhi();
                    const tenGod = getTenGod(dayMasterGan, yGan); // 流年天干 vs 日主

                    // 準備流月資料 (五虎遁)
                    const monthlyData = [];
                    for(let mIdx=0; mIdx<12; mIdx++) {
                        const mGanZhi = getMonthGanZhi(yGan, mIdx);
                        const mTenGod = getTenGod(dayMasterGan, mGanZhi.gan);
                        monthlyData.push({ monthIndex: mIdx, ganzhi: mGanZhi.ganzhi, tengod: mTenGod });
                    }

                    const yObj = { num: targetYear, gz: yGan + yZhi, tg: tenGod, months: monthlyData };
                    window.yearlyDataList.push(yObj);
                    
                    yearlyHtml += generateYearlyBlockHtml(yObj);
                }
                document.getElementById('yearlyFortuneContainer').innerHTML = yearlyHtml;
                window.globalDayMaster = dayMasterGan; // 供 PDF 使用

                setTimeout(() => { resultSec.classList.remove('opacity-0'); }, 100);
            }, 500);
        }

                    </div>

                    ${getPdfYearlyBlockHtml(window.yearlyDataList[0])}
                    ${getPdfYearlyBlockHtml(window.yearlyDataList[1])}

                    <div style="text-align: center; margin-top: 30px; padding-top: 15px; border-top: 1px solid #CBD5E1; color: #94A3B8; font-size: 12px;">
                        本報告嚴格採用東方天文節氣、大運順逆及五虎遁十神學理推演。無任何隨機函數。
                    </div>
                </div>
            `;

            const container = document.getElementById('hiddenPdfContainer');
            container.innerHTML = pdfHtml;

            const opt = {
                margin:       [12, 12, 12, 12], 
                filename:     `玄機探秘_${rName}_真傳命理報告.pdf`,
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#FDFBF7' }, 
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(container.firstElementChild).save().then(() => {
                btn.disabled = false;
                icon.textContent = "📄";
                text.textContent = "下載真傳命理報告 (PDF)";
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                container.innerHTML = ''; 
            });
        }
    </script>
</body>
